name: CI

on:
  push:
    branches:
      - main
      - "feature/**"
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  typecheck:
    name: TypeScript type-check
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Type-check Orb Loop Director
        run: npx --yes -p typescript@5.9.2 tsc --noEmit --strict --target ES2020 --module commonjs src/orbLoopDirector.ts
